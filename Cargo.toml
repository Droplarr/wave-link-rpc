[package]
name = "wave-link-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Unofficial typed Rust SDK for the Wave Link loopback RPC interface"
repository = "https://github.com/Droplarr/wave-link-rpc"
readme = "README.md"
keywords = ["audio", "mixer", "wave-link", "websocket"]
categories = ["api-bindings", "multimedia::audio"]

[features]
default = []
unstable-raw = []

[dependencies]
futures-util = "0.3"
http = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.28"

[dev-dependencies]
tempfile = "3.17"
tokio = { version = "1.43", features = ["rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
