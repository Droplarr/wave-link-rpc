name: Live Wave Link validation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validation mode
        required: true
        default: read
        type: choice
        options:
          - read
          - bounded-write
      authorize_bounded_writes:
        description: Type AUTHORIZE-BOUNDED-WRITES for write mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wave-link-live
  cancel-in-progress: false

jobs:
  validate:
    name: Windows Wave Link read validation
    runs-on: [self-hosted, Windows, X64, wave-link-live]
    timeout-minutes: 10
    env:
      WAVE_LINK_LIVE_MODE: ${{ inputs.mode }}
      WAVE_LINK_WRITE_AUTHORIZATION: ${{ inputs.authorize_bounded_writes }}
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Run live validation
        shell: cmd
        run: |
          if "%WAVE_LINK_LIVE_MODE%"=="bounded-write" if not "%WAVE_LINK_WRITE_AUTHORIZATION%"=="AUTHORIZE-BOUNDED-WRITES" exit /b 2
          cargo run --locked --bin wave_link_live
